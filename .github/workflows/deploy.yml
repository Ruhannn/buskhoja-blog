name: Build and push blog

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/ruhannn/better-buskhoja/blog:latest
          build-args: |
            PUBLIC_NOCODB_API_URL=${{secrets.PUBLIC_NOCODB_API_URL}}
            PUBLIC_NOCODB_API_TOKEN=${{secrets.PUBLIC_NOCODB_API_TOKEN}}
